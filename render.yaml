services:
  - type: web
    name: sales-agent-team
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: COMMUNICATIONS_SERVICE_TOKEN
        generateValue: true
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_ROOM
        value: salesagent-team-live
      - key: PHOTON_PHONE_NUMBER
        sync: false
      - key: PHOTON_SIP_ADDRESS
        value: sip.photon.codes:5061
      - key: PHOTON_SIP_USERNAME
        sync: false
      - key: PHOTON_SIP_PASSWORD
        sync: false
      - key: PHOTON_PROJECT_ID
        sync: false
      - key: PHOTON_API_KEY
        sync: false
      - key: PHOTON_MESSAGE_PLATFORM
        value: sms
      - key: SUPABASE_DB_URL
        sync: false
